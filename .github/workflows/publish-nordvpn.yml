name: Publish NordVPN prerelease

on:
  schedule:
    - cron: "45 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string

run-name: Publish NordVPN ${{ inputs.version || 'latest unpublished tag' }}

permissions:
  contents: write

concurrency:
  group: publish-nordvpn
  cancel-in-progress: false

jobs:
  discover:
    name: Find an unpublished NordVPN tag
    runs-on: ubuntu-latest
    outputs:
      source-tag: ${{ steps.select.outputs.source-tag }}
      release-tag: ${{ steps.select.outputs.release-tag }}
      publish: ${{ steps.select.outputs.publish }}
    env:
      SOURCE_REPOSITORY: NordSecurity/nordvpn-linux
      RELEASE_REPOSITORY: ${{ github.repository }}
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - id: select
        name: Select newest unpublished stable tag
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_VERSION" ]]; then
            candidates=("$REQUESTED_VERSION")
          else
            candidates=()
            while IFS= read -r tag; do
              if [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                candidates+=("$tag")
              fi
            done < <(gh api "repos/$SOURCE_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name')
            if (( ${#candidates[@]} > 0 )); then
              mapfile -t candidates < <(printf '%s\n' "${candidates[@]}" | sort -Vr)
            fi
          fi

          for tag in "${candidates[@]}"; do
            if [[ ! "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "version must be an existing stable tag such as 5.1.0" >&2
              exit 1
            fi

            gh api "repos/$SOURCE_REPOSITORY/git/ref/tags/$tag" >/dev/null
            release_tag="nordvpn-v$tag"
            if ! gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
              {
                echo "source-tag=$tag"
                echo "release-tag=$release_tag"
                echo "publish=true"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No unpublished NordVPN tag found."
          echo "publish=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: discover
    if: needs.discover.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            goarch: amd64
            cc: gcc
            os: ubuntu-latest
          - arch: arm64
            goarch: arm64
            cc: aarch64-linux-gnu-gcc
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    env:
      SOURCE_REPOSITORY: NordSecurity/nordvpn-linux
      VERSION: ${{ needs.discover.outputs.source-tag }}
      GOARCH: ${{ matrix.goarch }}
      CC: ${{ matrix.cc }}
    steps:
      - name: Check out NordVPN source
        uses: actions/checkout@v7
        with:
          repository: NordSecurity/nordvpn-linux
          ref: ${{ needs.discover.outputs.source-tag }}
          path: source
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: source/go.mod
          cache-dependency-path: source/go.sum

      - name: Install aarch64 cross compiler
        if: matrix.arch == 'arm64'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu libc6-dev-arm64-cross

      - name: Build Linux ${{ matrix.arch }} (mirror pkgs/nordvpn/cli.nix for portable release assets)
        run: |
          set -euo pipefail
          cd source
          OUT="../build/nordvpn-v${VERSION}-linux-${{ matrix.arch }}"
          mkdir -p "$OUT/bin"

          # cli.nix redirects AppDataPathStatic to its $out/bin. Release assets
          # cannot embed a Nix store path, so resolve the equivalent directory
          # from the running executable instead. This keeps norduserd next to
          # nordvpnd after default.nix installs the tarball into $out/bin.
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              Path("internal/constants.go"): (
                  'AppDataPathStatic = PrefixStaticPath("/usr/lib/nordvpn")',
                  'AppDataPathStatic = func() string { executable, err := os.Executable(); if err != nil { return "." }; return filepath.Dir(executable) }()',
              ),
          }

          for path, (old, new) in replacements.items():
              text = path.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"expected exactly one {old!r} in {path}")
              path.write_text(text.replace(old, new))
          PY

          # ldflags and subPackages match cli.nix.
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} CC=${{ matrix.cc }} go build -trimpath -ldflags "-X main.Environment=prod -X main.Version=${VERSION}" -o "$OUT/bin/cli" ./cmd/cli
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} CC=${{ matrix.cc }} go build -trimpath -ldflags "-X main.Environment=prod -X main.Version=${VERSION}" -o "$OUT/bin/daemon" ./cmd/daemon
          CGO_ENABLED=1 GOOS=linux GOARCH=${{ matrix.goarch }} CC=${{ matrix.cc }} go build -trimpath -ldflags "-X main.Environment=prod -X main.Version=${VERSION}" -o "$OUT/bin/norduser" ./cmd/norduser
          # cli.nix postInstall: rename and icons
          mv "$OUT/bin/cli" "$OUT/bin/nordvpn"
          mv "$OUT/bin/daemon" "$OUT/bin/nordvpnd"
          mv "$OUT/bin/norduser" "$OUT/bin/norduserd"
          ICONS_PATH="$OUT/share/icons/hicolor/scalable/apps"
          mkdir -p "$ICONS_PATH"
          install --mode=0444 assets/icon.svg "$ICONS_PATH/nordvpn.svg"
          for file in assets/tray-*.svg; do
            install --mode=0444 "$file" "$ICONS_PATH/nordvpn-$(basename "$file")"
          done
          cd ..
          tar -czf "build/nordvpn-v${VERSION}-linux-${{ matrix.arch }}.tar.gz" -C build "nordvpn-v${VERSION}-linux-${{ matrix.arch }}"
          (cd build && sha256sum "nordvpn-v${VERSION}-linux-${{ matrix.arch }}.tar.gz" > "nordvpn-v${VERSION}-linux-${{ matrix.arch }}.tar.gz.sha256")
          ls -lh build/*.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: nordvpn-${{ matrix.arch }}
          path: |
            build/nordvpn-v${{ needs.discover.outputs.source-tag }}-linux-${{ matrix.arch }}.tar.gz
            build/nordvpn-v${{ needs.discover.outputs.source-tag }}-linux-${{ matrix.arch }}.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Create prerelease
    needs: [discover, build]
    if: needs.discover.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      VERSION: ${{ needs.discover.outputs.source-tag }}
      RELEASE_TAG: ${{ needs.discover.outputs.release-tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: nordvpn-*
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          ls -lh *.tar.gz *.sha256 || true
          test -f "nordvpn-v${VERSION}-linux-amd64.tar.gz"
          cat *.sha256 > checksums.txt
          cat checksums.txt
          # arm64 is optional (matrix may fail but amd64 must exist)
          for f in nordvpn-v${VERSION}-linux-*.tar.gz; do
            sha256sum --check "$f.sha256"
          done

      - name: Create prerelease and upload assets
        run: |
          set -euo pipefail
          assets=(nordvpn-v${VERSION}-linux-*.tar.gz)
          gh release create "$RELEASE_TAG" "${assets[@]}" checksums.txt \
            --repo "$RELEASE_REPOSITORY" \
            --title "NordVPN $VERSION" \
            --prerelease --latest=false

  update-package:
    name: Update Nix package
    needs: [discover, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out package repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Update and validate NordVPN
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --with pyyaml --with semver==3.0.4 python -B scripts/update-releases.py
          updates.yml nordvpn --check --build

      - name: Commit package update
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- pkgs/nordvpn/default.nix; then
            echo "No NordVPN package update to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/nordvpn/default.nix
          git commit -m "nordvpn: ${{ needs.discover.outputs.source-tag }}"
          git push origin HEAD:"$TARGET_BRANCH"
