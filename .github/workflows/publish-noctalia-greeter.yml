name: Publish Noctalia Greeter prerelease

on:
  schedule:
    - cron: "35 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string

run-name: Publish Noctalia Greeter ${{ inputs.version || 'latest unpublished tag' }}

permissions:
  contents: write

concurrency:
  group: publish-noctalia-greeter
  cancel-in-progress: false

jobs:
  discover:
    name: Find an unpublished greeter tag
    uses: ./.github/workflows/find-unpublished-release.yml
    with:
      source_repository: noctalia-dev/noctalia-greeter
      release_prefix: noctalia-greeter-
      requested_version: ${{ inputs.version }}
      tag_pattern: '^v[0-9]+\.[0-9]+\.[0-9]+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$'
      version_example: 'a valid SemVer tag such as v1.3.1'
      semver: true

  build:
    name: Build Linux amd64 archive
    needs: discover
    if: needs.discover.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - name: Check out greeter source
        uses: actions/checkout@v7
        with:
          repository: noctalia-dev/noctalia-greeter
          ref: ${{ needs.discover.outputs.source-tag }}
          persist-credentials: false

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Remove native CPU flags
        shell: bash
        run: |
          set -euxo pipefail

          # Match upstream nix/package.nix postPatch exactly: keep the release
          # build, but remove host-specific CPU flags for portable binaries.
          sed -i "s/'-march=native', '-mtune=native',//" meson.build

          if grep -Eq -- '-march=native|-mtune=native' meson.build; then
            echo "Native CPU flags are still present" >&2
            exit 1
          fi

      - name: Build portable archive
        env:
          VERSION: ${{ needs.discover.outputs.source-tag }}
          ARCH: amd64
        run: |
          set -euo pipefail
          # Use upstream's own Nix dev shell for the exact build dependency set
          # (including wlroots 0.20 and the required stb revision), while keeping
          # /usr as the compiled install prefix so the release archive stays relocatable.
          nix develop --command bash -c '
            set -euo pipefail
            meson setup build --prefix=/usr --buildtype=release
            meson compile -C build
            DESTDIR="$PWD/stage" meson install -C build
          '

          test -x stage/usr/bin/noctalia-greeter
          test -x stage/usr/bin/noctalia-greeter-compositor
          test -x stage/usr/bin/noctalia-greeter-session
          test -x stage/usr/bin/noctalia-greeter-apply-appearance
          test -x stage/usr/bin/noctalia-greeter-print-greetd-config
          test -d stage/usr/share/noctalia-greeter/assets
          test -f stage/usr/share/polkit-1/actions/org.noctalia.greeter.apply-appearance.policy
          test -f stage/usr/lib/tmpfiles.d/noctalia-greeter.conf

          tar -C stage/usr -czf "noctalia-greeter-${VERSION}-linux-${ARCH}.tar.gz" .
          sha256sum "noctalia-greeter-${VERSION}-linux-${ARCH}.tar.gz" > "noctalia-greeter-${VERSION}-linux-${ARCH}.tar.gz.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: greeter-amd64
          path: |
            noctalia-greeter-${{ needs.discover.outputs.source-tag }}-linux-amd64.tar.gz
            noctalia-greeter-${{ needs.discover.outputs.source-tag }}-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Create prerelease
    needs:
      - discover
      - build
    if: needs.discover.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      VERSION: ${{ needs.discover.outputs.source-tag }}
      RELEASE_TAG: ${{ needs.discover.outputs.release-tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: greeter-*
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          assets=(
            "noctalia-greeter-${VERSION}-linux-amd64.tar.gz"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
            test -f "$asset.sha256"
            sha256sum --check "$asset.sha256"
          done
          cat "${assets[@]/%/.sha256}" > checksums.txt

      - name: Create prerelease and upload assets
        run: |
          gh release create "$RELEASE_TAG" \
            noctalia-greeter-"${VERSION}"-linux-amd64.tar.gz \
            checksums.txt \
            --repo "$RELEASE_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Noctalia Greeter $VERSION" \
            --prerelease \
            --latest=false

  update-package:
    name: Update Nix package
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out package repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Update and validate greeter
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --with pyyaml --with semver==3.0.4 python -B scripts/update-releases.py
          updates.yml noctalia-greeter --check --build

      - name: Commit package update
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- pkgs/noctalia-greeter/default.nix; then
            echo "No greeter package update to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/noctalia-greeter/default.nix
          git commit -m "update noctalia-greeter"
          git push origin HEAD:"$TARGET_BRANCH"
