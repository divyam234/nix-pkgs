name: Publish Noctalia prerelease

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      version:
        required: false
        type: string

run-name: Publish Noctalia ${{ inputs.version || 'latest unpublished tag' }}

permissions:
  contents: write

concurrency:
  group: publish-noctalia
  cancel-in-progress: false

jobs:
  discover:
    name: Find an unpublished Noctalia tag
    runs-on: ubuntu-latest
    outputs:
      source-tag: ${{ steps.select.outputs.source-tag }}
      release-tag: ${{ steps.select.outputs.release-tag }}
      publish: ${{ steps.select.outputs.publish }}
    env:
      SOURCE_REPOSITORY: noctalia-dev/noctalia
      RELEASE_REPOSITORY: ${{ github.repository }}
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - id: select
        name: Select newest unpublished tag
        run: |
          set -euo pipefail

          semver=(npx --yes semver@7.8.5)

          is_valid_tag() {
            local tag="$1"
            local version
            [[ "$tag" == v* ]] || return 1
            version="$("${semver[@]}" -- "${tag#v}")"
            [[ "$version" == "${tag#v}" ]]
          }

          if [[ -n "$REQUESTED_VERSION" ]]; then
            candidates=("$REQUESTED_VERSION")
          else
            candidates=()
            while IFS= read -r tag; do
              if is_valid_tag "$tag"; then
                candidates=("$tag")
                break
              fi
            done < <(
              gh api "repos/$SOURCE_REPOSITORY/tags?per_page=100" --paginate --jq '.[].name'
            )
          fi

          for tag in "${candidates[@]}"; do
            if ! is_valid_tag "$tag"; then
              echo "version must be a valid SemVer tag such as v5.0.0-beta.2" >&2
              exit 1
            fi

            gh api "repos/$SOURCE_REPOSITORY/git/ref/tags/$tag" >/dev/null
            release_tag="noctalia-$tag"
            if ! gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
              {
                echo "source-tag=$tag"
                echo "release-tag=$release_tag"
                echo "publish=true"
              } >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done

          echo "No unpublished Noctalia tag found."
          echo "publish=false" >> "$GITHUB_OUTPUT"

  build:
    name: Build Linux amd64 archive
    needs: discover
    if: needs.discover.outputs.publish == 'true'
    runs-on: ubuntu-latest
    container: debian:trixie

    steps:
      - name: Install build dependencies
        shell: bash
        run: |
          set -euxo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates \
            curl \
            git \
            g++ \
            meson \
            ninja-build \
            cmake \
            pkgconf \
            dpkg-dev \
            just \
            binutils \
            wayland-protocols \
            libwayland-dev \
            libegl-dev \
            libgles-dev \
            libfreetype-dev \
            libfontconfig-dev \
            libcairo2-dev \
            libpango1.0-dev \
            libharfbuzz-dev \
            libxkbcommon-dev \
            libglib2.0-dev \
            libsdbus-c++-dev \
            libpipewire-0.3-dev \
            libwireplumber-0.5-dev \
            libpam0g-dev \
            libpolkit-agent-1-dev \
            libpolkit-gobject-1-dev \
            libcurl4-openssl-dev \
            libwebp-dev \
            librsvg2-dev \
            libqalculate23 \
            libcln-dev \
            libmpfr-dev \
            libxml2-dev \
            libmd4c-dev \
            libtomlplusplus-dev \
            nlohmann-json3-dev \
            libstb-dev \
            libjemalloc-dev \
            libsecret-1-dev \
            libsodium-dev \
            libical-dev \
            libjxl-dev \
            libsndfile1-dev


          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT

          cd "$tmpdir"
          apt-get download libqalculate-dev

          qalculate_deb="$(
            find . -maxdepth 1 -type f \
              -name 'libqalculate-dev_*.deb' \
              -print -quit
          )"

          test -n "$qalculate_deb"

          mkdir unpacked
          dpkg-deb --extract "$qalculate_deb" unpacked

          multiarch="$(dpkg-architecture -qDEB_HOST_MULTIARCH)"
          source_libdir="$tmpdir/unpacked/usr/lib/$multiarch"
          target_libdir="/usr/lib/$multiarch"

          # Headers
          cp -a \
            "$tmpdir/unpacked/usr/include/libqalculate" \
            /usr/include/

          # Dynamic linker symlink used by -lqalculate
          cp -a \
            "$source_libdir/libqalculate.so" \
            "$target_libdir/"

          # pkg-config metadata used by Meson
          install -Dm644 \
            "$source_libdir/pkgconfig/libqalculate.pc" \
            "$target_libdir/pkgconfig/libqalculate.pc"

          cd /

          # Validate the manually assembled development environment.
          test -e "$target_libdir/libqalculate.so"
          pkg-config --exists libqalculate
          pkg-config --exists libcurl

          echo "libqalculate version:"
          pkg-config --modversion libqalculate

          echo "libcurl version:"
          pkg-config --modversion libcurl

          echo "libcurl linker flags:"
          pkg-config --libs libcurl

          # Ensure compilation will use the OpenSSL curl development library.
          readelf --version-info "$target_libdir/libcurl.so.4" \
            | grep -F 'CURL_OPENSSL_4'

      - name: Build wayland-protocols from source
        run: |
          apt-get install -y git meson ninja-build
          git clone --depth 1 --branch 1.48 \
            https://gitlab.freedesktop.org/wayland/wayland-protocols.git \
            /tmp/wayland-protocols
          cd /tmp/wayland-protocols
          meson setup build --prefix=/usr
          meson compile -C build
          meson install -C build

      - name: Check out Noctalia source
        uses: actions/checkout@v7
        with:
          repository: noctalia-dev/noctalia
          ref: ${{ needs.discover.outputs.source-tag }}
          persist-credentials: false

      - name: Configure portable CPU target
        shell: bash
        run: |
          set -euxo pipefail

          sed -i \
            -e "s/'-march=native'/'-march=x86-64-v3'/g" \
            -e "s/'-mtune=native'/'-mtune=generic'/g" \
            meson.build

          if grep -Eq -- '-march=native|-mtune=native' meson.build; then
            echo "Native CPU flags are still present" >&2
            exit 1
          fi
          grep -En -- '-march=|-mtune=' meson.build

      - name: Build portable archive
        env:
          VERSION: ${{ needs.discover.outputs.source-tag }}
          ARCH: amd64
        run: |
          set -euo pipefail
          just configure release /usr
          just build release
          DESTDIR="$PWD/stage" just install release
          test -x stage/usr/bin/noctalia
          test -d stage/usr/share/noctalia/assets
          tar -C stage/usr -czf "noctalia-${VERSION}-linux-${ARCH}.tar.gz" bin/noctalia share/noctalia
          sha256sum "noctalia-${VERSION}-linux-${ARCH}.tar.gz" > "noctalia-${VERSION}-linux-${ARCH}.tar.gz.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: noctalia-amd64
          path: |
            noctalia-${{ needs.discover.outputs.source-tag }}-linux-amd64.tar.gz
            noctalia-${{ needs.discover.outputs.source-tag }}-linux-amd64.tar.gz.sha256
          if-no-files-found: error

  publish:
    name: Create prerelease
    needs:
      - discover
      - build
    if: needs.discover.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      RELEASE_REPOSITORY: ${{ github.repository }}
      VERSION: ${{ needs.discover.outputs.source-tag }}
      RELEASE_TAG: ${{ needs.discover.outputs.release-tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: noctalia-*
          merge-multiple: true

      - name: Verify release assets
        run: |
          set -euo pipefail
          assets=(
            "noctalia-${VERSION}-linux-amd64.tar.gz"
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
            test -f "$asset.sha256"
            sha256sum --check "$asset.sha256"
          done
          cat "${assets[@]/%/.sha256}" > checksums.txt

      - name: Create prerelease and upload assets
        run: |
          gh release create "$RELEASE_TAG" \
            noctalia-"${VERSION}"-linux-amd64.tar.gz \
            checksums.txt \
            --repo "$RELEASE_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Noctalia $VERSION" \
            --prerelease \
            --latest=false

  update-package:
    name: Update Nix package
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: Check out package repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Update and validate Noctalia
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --with pyyaml --with semver==3.0.4 python -B scripts/update-releases.py
          updates.yml noctalia --check --build

      - name: Commit package update
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if git diff --quiet -- pkgs/noctalia/default.nix; then
            echo "No Noctalia package update to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/noctalia/default.nix
          git commit -m "update noctalia"
          git push origin HEAD:"$TARGET_BRANCH"
