name: Publish Tern release

on:
  schedule:
    - cron: "15 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Rebuild even if the release tag already exists (overwrites assets)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish-tern
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Download, verify, and patch upstream Linux archives
        id: prepare
        env:
          STENCIL_COOKIE: ${{ secrets.STENCIL_COOKIE }}
          GH_TOKEN: ${{ github.token }}
          FORCE: ${{ inputs.force == true }}
        run: |
          args=()
          if [ "$FORCE" = true ]; then args+=(--force); fi
          python3 scripts/prepare-tern-release.py "${args[@]}"

      - name: Publish patched archives
        if: steps.prepare.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.prepare.outputs.tag }}
          VERSION: ${{ steps.prepare.outputs.version }}
        working-directory: dist
        run: |
          set -euo pipefail
          sha256sum --check checksums.txt
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --title "Tern $VERSION" \
              --notes-file release-notes.md --prerelease --latest=false
          fi
          gh release upload "$TAG" Tern-*-linux-*.tar.gz checksums.txt --clobber
          gh release edit "$TAG" --draft=false --prerelease --notes-file release-notes.md --latest=false

  update-package:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - uses: astral-sh/setup-uv@v7

      - name: Update and build Tern
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run --with pyyaml --with semver==3.0.4 python -B scripts/update-releases.py \
            updates.yml tern --check
          nix build .#tern

      - name: Commit package update
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          set -euo pipefail
          if git diff --quiet -- pkgs/tern/default.nix; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/tern/default.nix
          git commit -m "tern: $VERSION"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin HEAD:"$TARGET_BRANCH"
