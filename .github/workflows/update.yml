name: Update Packages

on:
  schedule:
    # 22:30 UTC is 04:00 IST the following day.
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-packages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Update flake inputs
        run: nix flake update

      - name: Update and validate packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --with pyyaml --with semver==3.0.4 python -B scripts/update-releases.py
          updates.yml --check --build --smoke-test

      - name: Update and validate Sublime
        run: nix shell nixpkgs#radare2 -c uv run --with r2pipe python -B pkgs/sublime/update.py

      - name: Commit package updates
        env:
          TARGET_BRANCH: ${{ github.ref_name }}
        run: |
          git add .
          if [ -z "$(git status --porcelain)" ]; then
            echo "No package updates to commit."
            exit 0
          fi

          if [ "$(git diff --cached --name-only)" = "flake.lock" ] && python - <<'PY'
          import json
          import subprocess

          with open("flake.lock") as lockfile:
              current = json.load(lockfile)
          previous = json.loads(subprocess.check_output(["git", "show", "HEAD:flake.lock"]))
          current["nodes"].pop("nixpkgs", None)
          previous["nodes"].pop("nixpkgs", None)
          raise SystemExit(0 if current == previous else 1)
          PY
          then
            echo "Only nixpkgs changed in flake.lock; skipping commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "update packages"
          git push origin HEAD:"$TARGET_BRANCH"
