name: Update Packages

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Test updater
        run: uv run --with pyyaml python -m unittest scripts/test_update_releases.py

      - name: Update and validate packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --with pyyaml python -B scripts/update-releases.py
          updates.yml --check --build --smoke-test --report .git/update-report.md

      - name: Create or update pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automated/package-updates
          delete-branch: true
          commit-message: update packages
          title: Update Nix packages
          body-path: .git/update-report.md
          labels: dependencies,automated
