name: Publish aria2 release

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "aria2 version, for example 1.37.0"
        required: false
        type: string

run-name: Publish aria2 ${{ inputs.version || 'latest release' }}

permissions:
  contents: write

concurrency:
  group: publish-aria2
  cancel-in-progress: false

jobs:
  discover:
    name: Find unpublished aria2 release
    runs-on: ubuntu-latest
    outputs:
      source-tag: ${{ steps.select.outputs.source-tag }}
      version: ${{ steps.select.outputs.version }}
      release-tag: ${{ steps.select.outputs.release-tag }}
      publish: ${{ steps.select.outputs.publish }}
    env:
      REQUESTED_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - id: select
        name: Select release
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$REQUESTED_VERSION" ]]; then
            version="${REQUESTED_VERSION#release-}"
            version="${version#v}"
            source_tag="release-${version}"
            gh api "repos/aria2/aria2/git/ref/tags/${source_tag}" >/dev/null
          else
            source_tag="$(gh api repos/aria2/aria2/releases/latest --jq .tag_name)"
            [[ "$source_tag" == release-* ]] || {
              echo "Unexpected aria2 release tag: $source_tag" >&2
              exit 1
            }
            version="${source_tag#release-}"
          fi

          release_tag="aria2-v${version}"
          if gh release view "$release_tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "source-tag=$source_tag"
            echo "version=$version"
            echo "release-tag=$release_tag"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.arch }}
    needs: discover
    if: needs.discover.outputs.publish == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            os: ubuntu-latest
            asset: aria2-static-linux-x86_64.tar.gz
          - arch: arm64
            os: ubuntu-24.04-arm
            asset: aria2-static-linux-arm64.tar.gz
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.discover.outputs.version }}
      SOURCE_TAG: ${{ needs.discover.outputs.source-tag }}
      ASSET: ${{ matrix.asset }}

    steps:
      - name: Check out package repository
        uses: actions/checkout@v7
        with:
          path: package

      - name: Check out aria2 source
        uses: actions/checkout@v7
        with:
          repository: aria2/aria2
          ref: ${{ env.SOURCE_TAG }}
          path: source
          fetch-depth: 1
          persist-credentials: false

      - name: Install GNU build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake autopoint build-essential ca-certificates cmake curl \
            file git libtool pkg-config xz-utils bzip2 perl

      - name: Build patched static GNU aria2c
        shell: bash
        run: |
          set -euo pipefail

          prefix="$RUNNER_TEMP/aria2-static"
          build="$RUNNER_TEMP/aria2-build"
          mkdir -p "$prefix" "$build"

          export CPPFLAGS="-I$prefix/include"
          export CFLAGS="-O2"
          export CXXFLAGS="-O2"
          export LDFLAGS="-L$prefix/lib -L$prefix/lib64 -static"
          export PKG_CONFIG_PATH="$prefix/lib/pkgconfig:$prefix/lib64/pkgconfig"

          cd "$build"

          curl -L https://www.zlib.net/zlib-1.3.2.tar.gz | tar xz
          cd zlib-1.3.2
          ./configure --prefix="$prefix" --static
          make -j"$(nproc)"
          make install
          cd "$build"

          curl -L https://github.com/libexpat/libexpat/releases/download/R_2_8_1/expat-2.8.1.tar.bz2 | tar xj
          cd expat-2.8.1
          ./configure --prefix="$prefix" --enable-static --disable-shared --without-examples --without-tests --without-docbook
          make -j"$(nproc)"
          make install
          cd "$build"

          curl -L https://github.com/c-ares/c-ares/releases/download/v1.34.6/c-ares-1.34.6.tar.gz | tar xz
          cd c-ares-1.34.6
          ./configure --prefix="$prefix" --enable-static --disable-shared --disable-tests
          make -j"$(nproc)"
          make install
          cd "$build"

          curl -L https://github.com/openssl/openssl/releases/download/openssl-3.6.2/openssl-3.6.2.tar.gz | tar xz
          cd openssl-3.6.2
          case "$(uname -m)" in
            x86_64) openssl_target=linux-x86_64 ;;
            aarch64) openssl_target=linux-aarch64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          ./Configure "$openssl_target" --prefix="$prefix" no-shared no-tests no-module
          make -j"$(nproc)"
          make install_sw
          cd "$build"

          curl -L https://www.sqlite.org/2026/sqlite-autoconf-3530100.tar.gz | tar xz
          cd sqlite-autoconf-3530100
          ./configure --prefix="$prefix" --enable-static --disable-shared --disable-load-extension
          make -j"$(nproc)"
          make install
          cd "$build"

          curl -L https://github.com/libssh2/libssh2/releases/download/libssh2-1.11.1/libssh2-1.11.1.tar.gz | tar xz
          cd libssh2-1.11.1
          ./configure --prefix="$prefix" --enable-static --disable-shared --with-crypto=openssl --disable-examples-build
          make -j"$(nproc)"
          make install
          cd "$build"

          git clone --depth=1 --branch v3.3.2 https://github.com/microsoft/mimalloc.git mimalloc
          cmake -S mimalloc -B mimalloc/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$prefix" \
            -DMI_INSTALL_TOPLEVEL=ON \
            -DMI_USE_CXX=ON \
            -DMI_BUILD_SHARED=OFF \
            -DMI_BUILD_TESTS=OFF
          cmake --build mimalloc/build --parallel "$(nproc)"
          cmake --install mimalloc/build

          cd "$GITHUB_WORKSPACE/source"
          git apply "$GITHUB_WORKSPACE/package/pkgs/aria2/patches/"*.patch
          sed -E -i 's/AM_GNU_GETTEXT_VERSION\(([^)]*)\)/AM_GNU_GETTEXT_REQUIRE_VERSION(\1)/g' configure.ac
          autoreconf -fi
          ./configure \
            --prefix=/usr/local \
            --with-libz \
            --with-libcares \
            --with-libexpat \
            --without-libxml2 \
            --without-libgcrypt \
            --with-openssl \
            --without-libnettle \
            --without-gnutls \
            --without-libgmp \
            --with-libssh2 \
            --with-sqlite3 \
            --with-mimalloc \
            --with-ca-bundle=/etc/ssl/certs/ca-certificates.crt \
            ARIA2_STATIC=yes \
            --disable-shared
          make -j"$(nproc)"

          src/aria2c --version | grep -F "aria2 version ${VERSION}"
          file src/aria2c | grep -F 'statically linked'
          if readelf -l src/aria2c | grep -q INTERP; then
            echo "aria2c is dynamically linked" >&2
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/release"
          install -Dm755 src/aria2c "$GITHUB_WORKSPACE/release/aria2c"
          cd "$GITHUB_WORKSPACE"
          tar -C release -czf "$ASSET" aria2c
          sha256sum "$ASSET" > "$ASSET.sha256"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: aria2-${{ matrix.arch }}
          path: |
            ${{ matrix.asset }}
            ${{ matrix.asset }}.sha256
          if-no-files-found: error

  publish:
    name: Create release
    needs: [discover, build]
    if: needs.discover.outputs.publish == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.discover.outputs.version }}
      RELEASE_TAG: ${{ needs.discover.outputs.release-tag }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: aria2-*
          merge-multiple: true

      - name: Verify release assets
        shell: bash
        run: |
          set -euo pipefail
          assets=(
            aria2-static-linux-x86_64.tar.gz
            aria2-static-linux-arm64.tar.gz
          )
          for asset in "${assets[@]}"; do
            test -f "$asset"
            test -f "$asset.sha256"
            sha256sum --check "$asset.sha256"
          done
          cat "${assets[@]/%/.sha256}" > checksums.txt

      - name: Publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" \
            aria2-static-linux-x86_64.tar.gz \
            aria2-static-linux-arm64.tar.gz \
            checksums.txt \
            --repo "$GITHUB_REPOSITORY" \
            --title "aria2 $VERSION" \
            --notes "Static aria2c binaries built from aria2/aria2 release-${VERSION} with the vendored patch set." \
            --latest=false

  update-package:
    name: Update Nix package
    needs: [discover, publish]
    runs-on: ubuntu-latest
    steps:
      - name: Check out package repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Update and validate aria2
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          uv run --with pyyaml --with semver==3.0.4 python -B scripts/update-releases.py
          updates.yml aria2 --check --build --smoke-test

      - name: Commit package update
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- pkgs/aria2/default.nix; then
            echo "No aria2 package update to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/aria2/default.nix
          git commit -m "aria2: ${{ needs.discover.outputs.version }}"
          git push origin HEAD:"$TARGET_BRANCH"
