name: Find unpublished release

on:
  workflow_call:
    inputs:
      source_repository:
        required: true
        type: string
      release_prefix:
        required: true
        type: string
      requested_version:
        required: false
        type: string
        default: ''
      tag_pattern:
        required: true
        type: string
      version_example:
        required: true
        type: string
      semver:
        required: false
        type: boolean
        default: false
      sort_version_reverse:
        required: false
        type: boolean
        default: false
    secrets:
      gh_token:
        required: false
    outputs:
      source-tag:
        value: ${{ jobs.select.outputs.source-tag }}
      release-tag:
        value: ${{ jobs.select.outputs.release-tag }}
      publish:
        value: ${{ jobs.select.outputs.publish }}

jobs:
  select:
    runs-on: ubuntu-latest
    outputs:
      source-tag: ${{ steps.select.outputs.source-tag }}
      release-tag: ${{ steps.select.outputs.release-tag }}
      publish: ${{ steps.select.outputs.publish }}
    env:
      SOURCE_REPOSITORY: ${{ inputs.source_repository }}
      RELEASE_REPOSITORY: ${{ github.repository }}
      RELEASE_PREFIX: ${{ inputs.release_prefix }}
      REQUESTED_VERSION: ${{ inputs.requested_version }}
      TAG_PATTERN: ${{ inputs.tag_pattern }}
      VERSION_EXAMPLE: ${{ inputs.version_example }}
      USE_SEMVER: ${{ inputs.semver }}
      SORT_VERSION_REVERSE: ${{ inputs.sort_version_reverse }}
      GH_TOKEN: ${{ secrets.gh_token || github.token }}

    steps:
      - id: select
        name: Select newest unpublished tag
        shell: bash
        run: |
          set -euo pipefail

          matches_pattern() {
            local tag="$1"
            [[ "$tag" =~ $TAG_PATTERN ]]
          }

          if [[ -n "$REQUESTED_VERSION" ]]; then
            if ! matches_pattern "$REQUESTED_VERSION"; then
              echo "version must match $VERSION_EXAMPLE" >&2
              exit 1
            fi
            if [[ "$USE_SEMVER" == "true" ]]; then
              version="${REQUESTED_VERSION#v}"
              [[ "$REQUESTED_VERSION" == v* ]] || {
                echo "version must match $VERSION_EXAMPLE" >&2
                exit 1
              }
              [[ "$(npx --yes semver@7.8.5 -- "$version")" == "$version" ]] || {
                echo "version must match $VERSION_EXAMPLE" >&2
                exit 1
              }
            fi
            tag="$REQUESTED_VERSION"
          else
            candidates=()
            while IFS= read -r candidate; do
              if matches_pattern "$candidate"; then
                candidates+=("$candidate")
              fi
            done < <(
              gh api "repos/$SOURCE_REPOSITORY/tags?per_page=100" --jq '.[].name'
            )

            if [[ ${#candidates[@]} -eq 0 ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$USE_SEMVER" == "true" ]]; then
              versions=()
              for candidate in "${candidates[@]}"; do
                [[ "$candidate" == v* ]] || continue
                versions+=("${candidate#v}")
              done

              if [[ ${#versions[@]} -eq 0 ]]; then
                echo "publish=false" >> "$GITHUB_OUTPUT"
                exit 0
              fi

              mapfile -t valid_versions < <(npx --yes semver@7.8.5 -- "${versions[@]}")
              declare -A valid_semver=()
              for version in "${valid_versions[@]}"; do
                valid_semver["$version"]=1
              done

              filtered=()
              for candidate in "${candidates[@]}"; do
                version="${candidate#v}"
                if [[ -n "${valid_semver[$version]+x}" ]]; then
                  filtered+=("$candidate")
                fi
              done
              candidates=("${filtered[@]}")
            fi

            if [[ ${#candidates[@]} -eq 0 ]]; then
              echo "publish=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi

            if [[ "$SORT_VERSION_REVERSE" == "true" ]]; then
              mapfile -t candidates < <(printf '%s\n' "${candidates[@]}" | sort -Vr)
            fi

            # Automatic runs consider only the newest valid source tag.
            tag="${candidates[0]}"
          fi

          release_tag="${RELEASE_PREFIX}${tag}"
          if gh release view "$release_tag" --repo "$RELEASE_REPOSITORY" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          {
            echo "source-tag=$tag"
            echo "release-tag=$release_tag"
            echo "publish=true"
          } >> "$GITHUB_OUTPUT"
