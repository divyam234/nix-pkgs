name: Publish IDA Pro release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Override auto-detected version (e.g. 9.4)"
        required: false
        type: string
      magnet:
        description: "Override magnet link"
        required: false
        type: string

run-name: Publish IDA Pro ${{ inputs.version || 'latest from hex-rays.com' }}

permissions:
  contents: write

concurrency:
  group: publish-ida-pro
  cancel-in-progress: false

jobs:
  scrape:
    name: Check hexrays.su for new release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      date: ${{ steps.detect.outputs.date }}
      magnet: ${{ steps.detect.outputs.magnet }}
      publish: ${{ steps.detect.outputs.publish }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v7

      - id: detect
        run: |
          uv run --with beautifulsoup4 python3 << 'PYEOF'
          import os, re, sys, urllib.request
          from bs4 import BeautifulSoup

          req = urllib.request.Request(
              "https://hexrays.su/",
              headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"},
          )
          html = urllib.request.urlopen(req, timeout=30).read().decode()

          soup = BeautifulSoup(html, "html.parser")
          details = soup.find("details", class_="rel")
          if not details:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("publish=false\n")
              sys.exit(0)

          ver_span = details.find("span", class_="ver")
          date_span = details.find("span", class_="date")

          raw = ver_span.get_text(strip=True) if ver_span else ""
          ver = re.sub(r"^IDA(?:\s+Pro)?\s+", "", raw)
          ver = re.sub(r"\s+Beta\s+", "-beta", ver, flags=re.IGNORECASE)
          ver = re.sub(r"\s+SP\s*", "sp", ver, flags=re.IGNORECASE)
          # Strip Hotfix and any parenthesized suffix: "9.4 (Hotfix)" -> "9.4" (ignore hotfix)
          ver = re.sub(r"\s*\(\s*Hotfix\s*\)\s*", "", ver, flags=re.IGNORECASE)
          ver = re.sub(r"\s*\(\s*[^)]+\s*\)\s*", "", ver)
          ver = ver.replace(" ", "")
          # Sanitize any remaining unsafe chars for shell/tag/filesystem
          ver = re.sub(r"[()]", "", ver)
          ver = re.sub(r"[^A-Za-z0-9._-]", "-", ver)
          ver = re.sub(r"-+", "-", ver).strip("-")

          date = date_span.get_text(strip=True) if date_span else ""

          magnet_link = details.find("a", href=lambda h: h and h.startswith("magnet:"))
          magnet = magnet_link["href"] if magnet_link else ""

          current = ""
          with open("pkgs/ida-pro/default.nix") as f:
              m = re.search(r'^\s*version = "([^"]+)";', f.read(), re.MULTILINE)
              if m:
                  current = m.group(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={ver}\n")
              f.write(f"date={date}\n")
              f.write(f"magnet={magnet}\n")
              f.write("publish=false\n" if ver == current else "publish=true\n")
          PYEOF

  prepare:
    name: Download, repack, and publish
    needs: scrape
    if: needs.scrape.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download torrent
        env:
          MAGNET: ${{ inputs.magnet || needs.scrape.outputs.magnet }}
        run: |
          mkdir -p torrent
          aria2c --seed-time=0 --max-connection-per-server=16 --split=16 \
            --dir torrent "$MAGNET"

      - name: Find assets
        id: assets
        run: |
          set -euo pipefail

          shopt -s nullglob
          entries=(torrent/*/)
          TORRENT_DIR="${entries[0]:-torrent}"

          if [ -d "$TORRENT_DIR/setup" ]; then
            TORRENT_DIR="$TORRENT_DIR/setup"
          fi

          echo "torrent-dir=$TORRENT_DIR" >> "$GITHUB_OUTPUT"


      - name: Extract .run installers
        env:
          VERSION: ${{ needs.scrape.outputs.version }}
        run: |
          set -euo pipefail

          CONTENT="$PWD/content/ida-pro-${VERSION}"
          mkdir -p "$CONTENT"

          TORRENT_DIR="${{ steps.assets.outputs.torrent-dir }}"
          echo "Torrent dir: $TORRENT_DIR"
          ls -la "$TORRENT_DIR"

          shopt -s nullglob
          for f in "$TORRENT_DIR"/ida-pro_*_x64linux.run; do
            subdir="x86_64-linux"
            mkdir -p "$CONTENT/$subdir"
            cp "$f" /tmp/ida-installer
            chmod +x /tmp/ida-installer
            /tmp/ida-installer --mode unattended --unattendedmodeui none \
              --prefix "$CONTENT/$subdir"
          done

          for dir in kg_patch; do
            src=""
            [ -d "$TORRENT_DIR/../$dir" ] && src="$TORRENT_DIR/../$dir"
            [ -d "$TORRENT_DIR/$dir" ] && src="$TORRENT_DIR/$dir"
            [ -n "$src" ] && cp -r "$src" "$CONTENT/"
          done

          rm -rf "$CONTENT/kg_patch/x64win" "$CONTENT/kg_patch/README" 2>/dev/null || true

      - name: Create tarball
        run: |
          VERSION="${{ needs.scrape.outputs.version }}"
          mkdir -p _releases
          tar czf "_releases/ida-pro-${VERSION}.tar.gz" \
            -C content "ida-pro-${VERSION}"
          ls -lh "_releases/ida-pro-${VERSION}.tar.gz"

      - name: Get Nix hash
        id: hash
        run: |
          VERSION="${{ needs.scrape.outputs.version }}"
          HASH=$(nix hash file --sri "_releases/ida-pro-${VERSION}.tar.gz")
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.scrape.outputs.version }}"
          TAG="ida-pro-${VERSION}"
          TARBALL="_releases/ida-pro-${VERSION}.tar.gz"

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "$TARBALL" \
              --repo "${{ github.repository }}" \
              --title "IDA Pro ${VERSION}" \
              --notes "IDA Pro ${VERSION} (published ${{ needs.scrape.outputs.date }}) — Nix package" \
              --prerelease --latest=false
          fi

      - name: Update nix package
        run: |
          VERSION="${{ needs.scrape.outputs.version }}"
          HASH="${{ steps.hash.outputs.hash }}"

          sed -i \
            -e "s/^\(\s*\)version = \".*\";/\1version = \"${VERSION}\";/" \
            -e "s/^\(\s*\)hash = \".*\";/\1hash = \"${HASH}\";/" \
            pkgs/ida-pro/default.nix

      - name: Commit package update
        run: |
          if git diff --quiet -- pkgs/ida-pro/default.nix; then
            echo "No package updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/ida-pro/default.nix
          git commit -m "ida-pro: ${{ needs.scrape.outputs.version }}"
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
