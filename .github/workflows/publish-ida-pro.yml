name: Publish IDA Pro release

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      version:
        description: "Override auto-detected version (e.g. 9.4)"
        required: false
        type: string
      magnet:
        description: "Override magnet link"
        required: false
        type: string

run-name: Publish IDA Pro ${{ inputs.version || 'latest from hex-rays.com' }}

permissions:
  contents: write

concurrency:
  group: publish-ida-pro
  cancel-in-progress: false

jobs:
  scrape:
    name: Check hexrays.su for new release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.detect.outputs.version }}
      date: ${{ steps.detect.outputs.date }}
      magnet: ${{ steps.detect.outputs.magnet }}
      publish: ${{ steps.detect.outputs.publish }}

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: astral-sh/setup-uv@v7

      - id: detect
        run: |
          uv run --with beautifulsoup4 python3 << 'PYEOF'
          import os, re, sys, urllib.request
          from bs4 import BeautifulSoup

          req = urllib.request.Request(
              "https://hexrays.su/",
              headers={"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"},
          )
          html = urllib.request.urlopen(req, timeout=30).read().decode()

          soup = BeautifulSoup(html, "html.parser")
          details = soup.find("details", class_="rel")
          if not details:
              with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                  f.write("publish=false\n")
              sys.exit(0)

          ver_span = details.find("span", class_="ver")
          date_span = details.find("span", class_="date")

          raw = ver_span.get_text(strip=True) if ver_span else ""
          ver = re.sub(r"^IDA(?:\s+Pro)?\s+", "", raw)
          ver = re.sub(r"\s+Beta\s+", "-beta", ver, flags=re.IGNORECASE)
          ver = re.sub(r"\s+SP\s*", "sp", ver, flags=re.IGNORECASE)
          # Strip Hotfix and any parenthesized suffix: "9.4 (Hotfix)" -> "9.4" (ignore hotfix)
          ver = re.sub(r"\s*\(\s*Hotfix\s*\)\s*", "", ver, flags=re.IGNORECASE)
          ver = re.sub(r"\s*\(\s*[^)]+\s*\)\s*", "", ver)
          ver = ver.replace(" ", "")
          # Sanitize any remaining unsafe chars for shell/tag/filesystem
          ver = re.sub(r"[()]", "", ver)
          ver = re.sub(r"[^A-Za-z0-9._-]", "-", ver)
          ver = re.sub(r"-+", "-", ver).strip("-")

          date = date_span.get_text(strip=True) if date_span else ""

          magnet_link = details.find("a", href=lambda h: h and h.startswith("magnet:"))
          magnet = magnet_link["href"] if magnet_link else ""

          current = ""
          with open("pkgs/ida-pro/default.nix") as f:
              m = re.search(r'^\s*version = "([^"]+)";', f.read(), re.MULTILINE)
              if m:
                  current = m.group(1)

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"version={ver}\n")
              f.write(f"date={date}\n")
              f.write(f"magnet={magnet}\n")
              f.write("publish=false\n" if ver == current else "publish=true\n")
          PYEOF

  extract-arm:
    name: Extract Linux ARM64 installer
    needs: scrape
    if: needs.scrape.outputs.publish == 'true'
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Download torrent
        env:
          MAGNET: ${{ inputs.magnet || needs.scrape.outputs.magnet }}
        run: |
          mkdir -p torrent
          aria2c --seed-time=0 --max-connection-per-server=16 --split=16 \
            --dir torrent "$MAGNET"

      - name: Extract and patch ARM64 installer
        env:
          VERSION: ${{ needs.scrape.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          installers=(torrent/*/setup/ida-pro_*_armlinux.run torrent/*/ida-pro_*_armlinux.run torrent/ida-pro_*_armlinux.run)
          keygens=(torrent/*/kg_patch/keygen.js torrent/kg_patch/keygen.js)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#keygens[@]}" -ne 1 ]; then
            echo "Expected one ARM installer and keygen" >&2
            exit 1
          fi
          CONTENT="$PWD/content/ida-pro-${VERSION}"
          mkdir -p "$CONTENT"
          KEYGEN="$PWD/${keygens[0]}"
          chmod +x "${installers[0]}"
          "${installers[0]}" --mode unattended --unattendedmodeui none \
            --prefix "$CONTENT"
          (cd "$CONTENT" && node "$KEYGEN")
          for file in ida idat libida.so libida32.so idapro.hexlic; do
            test -f "$CONTENT/$file"
          done

          tar czf "ida-pro-${VERSION}-aarch64-linux.tar.gz" -C content "ida-pro-${VERSION}"

      - uses: actions/upload-artifact@v4
        with:
          name: ida-pro-aarch64-linux
          path: ida-pro-*-aarch64-linux.tar.gz
          if-no-files-found: error
          retention-days: 1

  prepare:
    name: Download, repack, and publish
    needs: [scrape, extract-arm]
    if: needs.scrape.outputs.publish == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}

      - uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Download torrent
        env:
          MAGNET: ${{ inputs.magnet || needs.scrape.outputs.magnet }}
        run: |
          mkdir -p torrent
          aria2c --seed-time=0 --max-connection-per-server=16 --split=16 \
            --dir torrent "$MAGNET"

      - name: Find assets
        id: assets
        run: |
          set -euo pipefail

          shopt -s nullglob
          entries=(torrent/*/)
          TORRENT_DIR="${entries[0]:-torrent}"

          if [ -d "$TORRENT_DIR/setup" ]; then
            TORRENT_DIR="$TORRENT_DIR/setup"
          fi

          echo "torrent-dir=$TORRENT_DIR" >> "$GITHUB_OUTPUT"


      - name: Extract and patch x86_64 installer
        env:
          VERSION: ${{ needs.scrape.outputs.version }}
        run: |
          set -euo pipefail

          CONTENT="$PWD/content/ida-pro-${VERSION}"
          mkdir -p "$CONTENT"

          TORRENT_DIR="${{ steps.assets.outputs.torrent-dir }}"
          echo "Torrent dir: $TORRENT_DIR"
          ls -la "$TORRENT_DIR"

          shopt -s nullglob
          installers=("$TORRENT_DIR"/ida-pro_*_x64linux.run)
          keygens=("$TORRENT_DIR"/../kg_patch/keygen.js "$TORRENT_DIR"/kg_patch/keygen.js)
          if [ "${#installers[@]}" -ne 1 ] || [ "${#keygens[@]}" -ne 1 ]; then
            echo "Expected one x86_64 installer and keygen" >&2
            exit 1
          fi
          KEYGEN="$(realpath "${keygens[0]}")"
          chmod +x "${installers[0]}"
          "${installers[0]}" --mode unattended --unattendedmodeui none \
            --prefix "$CONTENT"
          (cd "$CONTENT" && node "$KEYGEN")
          for file in ida idat libida.so libida32.so idapro.hexlic; do
            test -f "$CONTENT/$file"
          done

          mkdir -p _releases
          tar czf "_releases/ida-pro-${VERSION}-x86_64-linux.tar.gz" \
            -C content "ida-pro-${VERSION}"

      - uses: actions/download-artifact@v4
        with:
          name: ida-pro-aarch64-linux
          path: _releases

      - name: Get Nix hash
        id: hash
        run: |
          VERSION="${{ needs.scrape.outputs.version }}"
          for arch in x86_64-linux aarch64-linux; do
            HASH=$(nix hash file --sri "_releases/ida-pro-${VERSION}-${arch}.tar.gz")
            echo "${arch}=$HASH" >> "$GITHUB_OUTPUT"
          done

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.scrape.outputs.version }}"
          TAG="ida-pro-${VERSION}"
          TARBALLS=("_releases/ida-pro-${VERSION}-x86_64-linux.tar.gz" "_releases/ida-pro-${VERSION}-aarch64-linux.tar.gz")

          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" "${TARBALLS[@]}" --repo "${{ github.repository }}" --clobber
          else
            gh release create "$TAG" "${TARBALLS[@]}" \
              --repo "${{ github.repository }}" \
              --title "IDA Pro ${VERSION}" \
              --notes "IDA Pro ${VERSION} (published ${{ needs.scrape.outputs.date }}) — Nix package" \
              --prerelease --latest=false
          fi

      - name: Update nix package
        run: |
          VERSION="${{ needs.scrape.outputs.version }}"
          X86_HASH="${{ steps.hash.outputs['x86_64-linux'] }}"
          ARM_HASH="${{ steps.hash.outputs['aarch64-linux'] }}"

          sed -i \
            -e "s/^\(\s*\)version = \".*\";/\1version = \"${VERSION}\";/" \
            -e "/^    x86_64-linux = {/,/^    };/s|hash = \".*\";|hash = \"${X86_HASH}\";|" \
            -e "/^    aarch64-linux = {/,/^    };/s|hash = \".*\";|hash = \"${ARM_HASH}\";|" \
            pkgs/ida-pro/default.nix

      - name: Commit package update
        run: |
          if git diff --quiet -- pkgs/ida-pro/default.nix; then
            echo "No package updates to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pkgs/ida-pro/default.nix
          git commit -m "ida-pro: ${{ needs.scrape.outputs.version }}"
          git push origin HEAD:"${{ github.event.repository.default_branch }}"
