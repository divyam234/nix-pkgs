packages:
  brave:
    repo: brave/brave-browser
    file: pkgs/brave/default.nix
    tagPrefix: v
    version:
      source: tag
    assets:
      x86_64-linux:
        pattern: '^brave-browser_[0-9]+\.[0-9]+\.[0-9]+_amd64\.deb$'
      aarch64-linux:
        pattern: '^brave-browser_[0-9]+\.[0-9]+\.[0-9]+_arm64\.deb$'

  beekeeper-studio:
    repo: beekeeper-studio/beekeeper-studio
    file: pkgs/beekeeper-studio/default.nix
    tagPrefix: v
    version:
      source: tag
    assets:
      x86_64-linux:
        pattern: '^beekeeper-studio_[0-9]+\.[0-9]+\.[0-9]+_amd64\.deb$'
      aarch64-linux:
        pattern: '^beekeeper-studio_[0-9]+\.[0-9]+\.[0-9]+_arm64\.deb$'

  dbeaver-bin:
    repo: dbeaver/dbeaver
    file: pkgs/dbeaver-bin/default.nix
    tagPrefix: ''
    version:
      source: tag
    assets:
      x86_64-linux:
        pattern: '^dbeaver-ce-[0-9]+\.[0-9]+\.[0-9]+-linux-x86_64\.tar\.gz$'
      aarch64-linux:
        pattern: '^dbeaver-ce-[0-9]+\.[0-9]+\.[0-9]+-linux-aarch64\.tar\.gz$'

  codeforge:
    repo: divyam234/codeforge
    file: pkgs/codeforge/default.nix
    tagPrefix: v
    version:
      source: tag
    assets:
      x86_64-linux:
        name: codeforge_{version}_linux_amd64.tar.gz
      aarch64-linux:
        name: codeforge_{version}_linux_arm64.tar.gz
    test:
      command: bin/codeforge
      args: [--version]
      expectedOutput: '{version}'

  foliate:
    source: github-head
    repo: johnfactotum/foliate
    file: pkgs/foliate/default.nix
    fetchSubmodules: true
    version:
      base: 3.3.0

  zed-editor:
    repo: zed-industries/zed
    file: pkgs/zed-editor/default.nix
    tagPrefix: v
    version:
      source: tag
    assets:
      x86_64-linux:
        name: zed-linux-x86_64.tar.gz
      aarch64-linux:
        name: zed-linux-aarch64.tar.gz

  aria2:
    repo: divyam234/aria2c-static
    file: pkgs/aria2/default.nix
    tagPrefix: release-
    version:
      source: tag
    assets:
      x86_64-linux:
        name: aria2-linux-amd64.tar.gz
      aarch64-linux:
        name: aria2-linux-arm64.tar.gz
    test:
      command: bin/aria2c
      args: [--version]
      expectedOutput: '{version}'

  bun:
    repo: oven-sh/bun
    file: pkgs/bun/default.nix
    tagPrefix: bun-v
    version:
      source: tag
    assets:
      x86_64-linux:
        name: bun-linux-x64.zip
      aarch64-linux:
        name: bun-linux-aarch64.zip
    test:
      command: bin/bun
      args: [--version]
      expectedOutput: '{version}'

  hydra:
    repo: divyam234/hydra
    file: pkgs/hydra/default.nix
    tagPrefix: v
    version:
      source: tag
    assets:
      x86_64-linux:
        name: hydra_Linux_x86_64.tar.gz
      aarch64-linux:
        name: hydra_Linux_arm64.tar.gz

  opencode:
    repo: anomalyco/opencode
    file: pkgs/opencode/default.nix
    tagPrefix: v
    version:
      source: tag
    assets:
      x86_64-linux:
        name: opencode-linux-x64.tar.gz
      aarch64-linux:
        name: opencode-linux-arm64.tar.gz
    test:
      command: bin/opencode
      args: [--version]
      expectedOutput: '{version}'

  openlogi:
    repo: AprilNEA/OpenLogi
    file: pkgs/openlogi/default.nix
    tagPrefix: v
    version:
      source: tag
    assets:
      x86_64-linux:
        pattern: '^openlogi-v[0-9]+\.[0-9]+\.[0-9]+-linux-amd64\.deb$'
      aarch64-linux:
        pattern: '^openlogi-v[0-9]+\.[0-9]+\.[0-9]+-linux-arm64\.deb$'

  rclone:
    repo: tgdrive/rclone
    file: pkgs/rclone/default.nix
    tagPrefix: v
    version:
      source: tag
    assets:
      x86_64-linux:
        pattern: '^rclone-v[0-9]+\.[0-9]+\.[0-9]+-linux-amd64\.zip$'
      aarch64-linux:
        pattern: '^rclone-v[0-9]+\.[0-9]+\.[0-9]+-linux-arm64\.zip$'
    test:
      command: bin/rclone
      args: [version]
      expectedOutput: '{version}'

  teldrive:
    repo: tgdrive/teldrive
    file: pkgs/teldrive/default.nix
    tagPrefix: ''
    version:
      source: tag
    assets:
      x86_64-linux:
        pattern: '^teldrive-[0-9]+\.[0-9]+\.[0-9]+-linux-amd64\.tar\.gz$'
      aarch64-linux:
        pattern: '^teldrive-[0-9]+\.[0-9]+\.[0-9]+-linux-arm64\.tar\.gz$'
    test:
      command: bin/teldrive
      args: [--version]
      expectedOutput: '{version}'

  zjstatus:
    repo: dj95/zjstatus
    file: pkgs/zjstatus/default.nix
    tagPrefix: v
    version:
      source: tag
    allowSharedAsset: true
    assets:
      x86_64-linux:
        name: zjstatus.wasm
      aarch64-linux:
        name: zjstatus.wasm
